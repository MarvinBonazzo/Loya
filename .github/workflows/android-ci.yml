name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate and build both flavors
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdk_manager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdk_manager" ]]; then
            sdk_manager="$(command -v sdkmanager)"
          fi
          "$sdk_manager" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate PWA package
        run: node scripts/validate-pwa.mjs

      - name: Compile both debug flavors
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:compileOfflineDebugKotlin
          :app:compileGoogleDebugKotlin

      - name: Lint both debug flavors
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:lintOfflineDebug
          :app:lintGoogleDebug

      - name: Assemble both debug flavors
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:assembleOfflineDebug
          :app:assembleGoogleDebug

      - name: Upload Offline universal debug APK
        uses: actions/upload-artifact@v7
        with:
          name: loya-offline-debug-universal
          path: app/build/outputs/apk/offline/debug/app-offline-universal-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Google universal debug APK
        uses: actions/upload-artifact@v7
        with:
          name: loya-google-debug-universal
          path: app/build/outputs/apk/google/debug/app-google-universal-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
